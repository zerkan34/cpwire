name: Build desktop (Tauri)

# Lancé à la main depuis l'onglet "Actions" de GitHub (bouton "Run workflow"),
# ou automatiquement quand tu crées un tag de version (ex. v1.0.0).
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances JS
        run: |
          npm install
          npm install --prefix web

      - name: Compiler l'application (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .

      - name: Publier l'installeur (téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: cpwire-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
