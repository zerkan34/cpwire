*{margin:0;padding:0;box-sizing:border-box}
:root{
 --navy:#1D1D1B; --indigo:#3B2E8C; --indigo-d:#2E2470;
 --gold:#F2C316; --gold-l:#F2C316; --gold-wash:#FDF6D6; --gold-line:#F0E2A6; --gold-ink:#7A5E12;
 --magenta:#E91E63; --m-wash:#FCE7EE;
 --lav:#F4F2FB; --lav-2:#E9E5F7;
 --bg:#FBFBFC; --card:#FFFFFF; --ink:#1D1D1B; --ink-soft:#46424E; --muted:#8B8894;
 --line:#ECEAF2; --line-2:#DFDBEE; --green:#2F7D4F; --red:#9A3B3B;
 --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
 --sh-sm:0 1px 2px rgba(40,36,80,.05);
 --sh-md:0 8px 24px -14px rgba(40,36,80,.20);
 --sh-lg:0 30px 70px -28px rgba(40,36,80,.30);
 --r-lg:20px; --r-md:16px; --r-sm:11px;
 --stick:56px;
}
html{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
::selection{background:var(--lav-2)}
.poppins{font-family:'Poppins',sans-serif}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
*::-webkit-scrollbar{height:10px;width:10px}
*::-webkit-scrollbar-thumb{background:#E2DEEF;border-radius:10px;border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:#D3CDE7}

/* ---------- bandeau info ---------- */
.mockbar{background:var(--lav);color:var(--ink-soft);font-family:'Inter';font-weight:500;font-size:11.5px;text-align:center;padding:8px 14px;display:flex;align-items:center;justify-content:center;gap:9px;border-bottom:1px solid var(--line)}
.mockbar .pt{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.mockbar b{color:var(--indigo);font-weight:600}

/* ---------- topbar ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:11px 28px}
.top .logo{height:26px}
.top .appname{font-family:'Poppins';font-weight:600;color:var(--navy);font-size:14.5px;border-left:1px solid var(--line-2);padding-left:18px;cursor:pointer;letter-spacing:-.01em}
.search{flex:1;max-width:540px;position:relative;margin:0 auto}
.search input{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:12px;padding:10px 16px 10px 42px;font:inherit;font-size:14px;color:var(--ink);transition:.16s}
.search input::placeholder{color:#AAA5C4}
.search input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px var(--lav-2)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--indigo);opacity:.55}
.top .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--indigo),var(--magenta));color:#fff;font-family:'Poppins';font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;margin-left:auto;box-shadow:var(--sh-sm)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:250px 1fr;align-items:start;max-width:1680px;margin:0 auto}
.side{position:sticky;top:var(--stick);height:calc(100vh - var(--stick));background:transparent;border-right:1px solid var(--line);padding:22px 16px;overflow-y:auto}
.navlbl{font-family:'Poppins';font-weight:600;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:#ADA8C6;padding:18px 12px 8px}
.navi{position:relative;display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:11px;color:var(--ink-soft);font-size:14px;margin-bottom:2px;transition:.14s}
.navi:hover{background:var(--lav)}
.navi.active{background:var(--indigo);color:#fff;font-weight:600}
.navi.active::before{display:none}
.navi svg{opacity:.7;flex:none}
.navi.active svg{opacity:1}
.navi .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:#ADA8C6;font-variant-numeric:tabular-nums}
.navi.active .cnt{color:rgba(255,255,255,.82)}
.main{padding:34px 44px 80px;min-width:0;max-width:none;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- hero clair ---------- */
.hero{position:relative;border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(180deg,#FCFBFF,#F6F3FD);border:1px solid var(--line);box-shadow:var(--sh-sm);padding:46px 46px 38px;color:var(--ink)}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--indigo),var(--magenta) 52%,var(--gold))}
.hero .ey{font-family:'Poppins';font-weight:600;letter-spacing:2.6px;text-transform:uppercase;font-size:10.5px;color:var(--indigo);margin-bottom:16px}
.hero h1{font-family:'Poppins';font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.025em;color:var(--navy);margin-bottom:12px}
.hero p{color:var(--muted);max-width:580px;font-size:15px}
.kpi{display:flex;gap:34px;margin-top:30px;flex-wrap:wrap;align-items:center}
.kpi .n{font-family:'Poppins';font-weight:700;font-size:22px;letter-spacing:-.01em;color:var(--indigo);white-space:nowrap}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi .sepv{width:1px;height:34px;background:var(--line-2)}

/* ---------- bande portefeuille (claire) ---------- */
.pboard{display:flex;gap:12px;margin-top:28px;padding-bottom:8px;overflow-x:auto;scroll-snap-type:x proximity}
.pchip{scroll-snap-align:start;flex:0 0 auto;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px 10px 10px;box-shadow:var(--sh-sm);transition:.15s}
.pchip:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:var(--line-2)}
.pchip .pcol{display:block;min-width:0}
.pchip .nm{display:block;font-family:'Poppins';font-weight:600;font-size:12.5px;color:var(--navy);line-height:1.25;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.pchip .vv{display:block;white-space:nowrap;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px;letter-spacing:-.02em}

/* ---------- monogram ---------- */
.monogram{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:700;font-size:15px;color:#fff;letter-spacing:.3px;text-shadow:0 1px 2px rgba(20,16,40,.25);box-shadow:0 3px 8px -2px rgba(75,63,143,.35)}
.monogram.assist{background:linear-gradient(145deg,#4A3AA6,#2E2470)}
.monogram.projet{background:linear-gradient(145deg,#F0417F,#C2185B)}
.monogram.both{background:linear-gradient(145deg,#3B2E8C,#E91E63)}
.monogram.sm{width:34px;height:34px;border-radius:10px;font-size:12px}

/* ---------- sections ---------- */
.sec{margin-top:46px}
.eyebrow{font-family:'Poppins';font-weight:600;letter-spacing:2.4px;text-transform:uppercase;font-size:10.5px;color:var(--indigo);margin-bottom:8px;display:flex;align-items:center;gap:12px}
.eyebrow::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--gold-line),transparent)}
.sec h2{font-family:'Poppins';font-weight:700;font-size:20px;color:var(--navy);letter-spacing:-.015em}
.sec .sub{color:var(--muted);font-size:14px;margin-top:4px}
.sec .sub a{color:var(--indigo);font-weight:500}

/* ---------- tuiles espaces ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:16px;margin-top:22px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:24px;transition:.16s;box-shadow:var(--sh-sm);overflow:hidden}
.tile::after{content:"";position:absolute;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--indigo),var(--gold));transition:.22s width}
.tile:hover{box-shadow:var(--sh-md);transform:translateY(-3px);border-color:var(--line-2)}
.tile:hover::after{width:100%}
.tile .ic{width:46px;height:46px;border-radius:13px;background:var(--lav);display:flex;align-items:center;justify-content:center;color:var(--indigo);margin-bottom:16px}
.tile h3{font-family:'Poppins';font-weight:600;font-size:15px;color:var(--navy)}
.tile p{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.tile .cnt{display:inline-flex;align-items:center;margin-top:16px;font-family:var(--mono);font-weight:600;font-size:11.5px;color:#1D1D1B;background:var(--gold);border:none;padding:4px 12px;border-radius:20px;font-variant-numeric:tabular-nums}

/* ---------- cartes clients ---------- */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:16px;margin-top:22px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;box-shadow:var(--sh-sm);transition:.16s;position:relative;overflow:hidden}
.ccard:hover{box-shadow:var(--sh-md);transform:translateY(-3px);border-color:var(--line-2)}
.cc-head{display:flex;align-items:center;gap:14px}
.cc-head h3{font-family:'Poppins';font-weight:600;font-size:15px;color:var(--navy);letter-spacing:-.01em;line-height:1.2}
.cc-head .e{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:7px}
.ccard .v{margin-top:16px;font-size:12px;color:var(--muted)}
.ccard .v .mono{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--navy)}
.ccard .bar{height:6px;border-radius:5px;background:var(--lav-2);margin-top:12px;overflow:hidden}
.ccard .bar>span{display:block;height:100%;border-radius:5px;background:var(--indigo);transition:width .5s ease}
.ccard.projet .bar>span{background:linear-gradient(90deg,#F0417F,#C2185B)}
.ccard.both .bar>span{background:linear-gradient(90deg,var(--indigo),var(--magenta))}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.assist,.dot.Assistance{background:var(--indigo)}.dot.projet,.dot.Projet{background:var(--magenta)}
.dot.both{background:linear-gradient(90deg,var(--indigo) 50%,var(--magenta) 50%)}

/* ---------- fil d'ariane + en-tête client ---------- */
.bc{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;margin-bottom:20px;flex-wrap:wrap}
.bc a:hover{color:var(--indigo)}.bc .sep{opacity:.4}.bc .cur{color:var(--navy);font-weight:500}
.chead{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 30px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;box-shadow:var(--sh-sm);overflow:hidden}
.chead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--indigo),var(--gold))}
.chead .cx{display:flex;align-items:center;gap:17px}
.chead h1{font-family:'Poppins';font-weight:700;font-size:23px;color:var(--navy);letter-spacing:-.02em}
.badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.badge{font-family:'Poppins';font-weight:600;font-size:11.5px;padding:5px 12px;border-radius:20px;display:flex;align-items:center;gap:7px}
.badge.assist{background:var(--indigo);color:#fff}.badge.projet{background:var(--magenta);color:#fff}
.badge.assist .dot,.badge.projet .dot{background:#fff!important;background-image:none!important}
.badge.contrat{background:#fff;color:var(--navy);border:1px dashed var(--gold-l)}
.cstats{display:flex;gap:28px;align-items:flex-start}
.cstats .st{text-align:right}
.cstats .st .v{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.cstats .st .l{font-size:11px;color:var(--muted);margin-top:6px}
.meta{text-align:right;font-size:12px;color:var(--muted)}
.meta .big{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--navy)}

/* ---------- catégories ---------- */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:18px}
.cat{position:relative;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px;text-align:left;box-shadow:var(--sh-sm);transition:.14s}
.cat:hover{border-color:var(--line-2);box-shadow:var(--sh-md);transform:translateY(-2px)}
.cat.active{border-color:var(--indigo);background:var(--lav)}
.cat .num{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--magenta);float:right}
.cat .n{font-family:'Poppins';font-weight:600;font-size:12.5px;color:var(--navy);line-height:1.35}
.cat .barc{height:4px;border-radius:3px;background:var(--lav-2);margin-top:11px;overflow:hidden}
.cat .barc>span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--indigo),var(--gold))}
.cat.active .barc{background:#E3DCF6}

/* ---------- filtres ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0 16px}
.filters select,.filters .fsearch{border:1px solid var(--line-2);background:#fff;border-radius:11px;padding:9px 13px;font:inherit;font-size:13px;color:var(--ink);transition:.14s}
.filters .fsearch{min-width:220px}
.filters select:focus,.filters .fsearch:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px var(--lav-2)}
.filters .reset{color:var(--muted);font-size:12.5px;background:none;border:none;text-decoration:underline;text-underline-offset:2px}
.filters .reset:hover{color:var(--indigo)}
.count{color:var(--muted);font-size:12px;margin-left:auto;font-family:var(--mono)}

/* ---------- tableau clair ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;font-size:13.5px;box-shadow:var(--sh-sm)}
.tbl thead th{background:var(--indigo);color:#fff;font-family:'Poppins';font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:13px 18px;border-bottom:none}
.tbl tbody td{padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:.1s background}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--lav)}
.tbl .name{display:flex;align-items:center;gap:11px;color:var(--navy);font-weight:500}
.tbl .name svg{flex:none;color:var(--indigo);opacity:.8}
.tbl .path{font-family:var(--mono);font-size:10.5px;color:#ABA5C6;margin-top:3px;letter-spacing:-.02em}
.tag{font-size:11px;color:var(--indigo);background:var(--lav-2);border-radius:11px;padding:3px 10px;font-family:'Poppins';font-weight:600;white-space:nowrap}
.tag.x{color:var(--gold-ink);background:var(--gold-wash)}
.tag.t{background:var(--lav);color:var(--ink-soft);display:inline-flex;align-items:center;gap:7px}
.tag.t i{width:6px;height:6px;border-radius:50%;flex:none}
.eng{font-size:11px;font-family:'Poppins';font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft)}
.more{display:block;margin:22px auto 0;background:#fff;border:1px solid var(--line-2);color:var(--indigo);font-family:'Poppins';font-weight:600;font-size:13px;padding:11px 26px;border-radius:24px;box-shadow:var(--sh-sm);transition:.14s}
.more:hover{background:var(--lav-2);transform:translateY(-1px)}
.empty{background:var(--card);border:1px dashed var(--line-2);border-radius:var(--r-md);padding:48px;text-align:center;color:var(--muted)}

/* ---------- colonnes / panneaux ---------- */
.cols{display:grid;grid-template-columns:1fr 300px;gap:26px;margin-top:28px;align-items:start}
@media(max-width:1024px){.cols{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{display:none}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;margin-bottom:16px;box-shadow:var(--sh-sm)}
.panel h3{font-family:'Poppins';font-weight:600;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--indigo);margin-bottom:13px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:none}.kv .k{color:var(--muted)}.kv .v{color:var(--navy);font-weight:500;text-align:right}

/* ---------- pied ---------- */
.foot{margin-top:58px;border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;color:#B4AFC6;font-size:12px}
.foot .a{font-family:'Poppins';font-weight:600;color:var(--indigo);letter-spacing:1px}

/* ---------- dépôt ---------- */
.dz{border:2px dashed var(--line-2);border-radius:var(--r-lg);background:linear-gradient(180deg,#fff,var(--lav));padding:48px 24px;text-align:center;color:var(--muted);transition:.16s;cursor:pointer;margin-top:22px}
.dz.drag{border-color:var(--indigo);background:var(--lav-2);color:var(--indigo);box-shadow:0 0 0 4px var(--lav-2)}
.dz h3{font-family:'Poppins';color:var(--navy);font-size:16px;margin-bottom:6px}
.dz .btn{display:inline-block;margin-top:16px;background:var(--indigo);color:#fff;font-family:'Poppins';font-weight:600;font-size:13px;padding:11px 22px;border-radius:24px;border:none;box-shadow:var(--sh-sm);transition:.14s}
.dz .btn:hover{background:var(--indigo-d);transform:translateY(-1px)}
.dzopts{display:flex;gap:16px;align-items:center;margin:16px 2px 4px;font-size:13px;color:var(--muted)}
.dzact{display:flex;gap:12px;align-items:center;margin:18px 0}
.dzbadge{font-size:10.5px;font-family:'Poppins';font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.dzbadge.ok{background:#E9F5EE;color:var(--green)}
.dzbadge.tri{background:#FBECEC;color:var(--red)}
.dzlink{color:var(--indigo);font-weight:600;font-size:12.5px;cursor:pointer}
.dzlink:hover{text-decoration:underline}
.dznote{background:var(--gold-wash);border:1px solid var(--gold-line);border-radius:13px;padding:15px 17px;font-size:12.5px;color:var(--gold-ink);margin-top:20px;line-height:1.55}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-family:'Poppins';font-weight:500;font-size:13px;padding:11px 18px;border-radius:12px;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- panneau détail document ---------- */
#modal{position:fixed;inset:0;z-index:200;display:none}
#modal.show{display:block}
#modal .mback{position:absolute;inset:0;background:rgba(40,36,80,.34);backdrop-filter:blur(3px);animation:fade .2s ease}
#modal .mcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);background:#fff;border-radius:18px;box-shadow:var(--sh-lg);padding:24px 26px;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
#modal .mhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
#modal .mx{margin-left:auto;background:var(--lav);border:none;width:30px;height:30px;border-radius:9px;color:var(--muted);font-size:14px}
#modal .mx:hover{background:var(--lav-2);color:var(--indigo)}
#modal .mcat{font-size:10.5px;font-family:'Poppins';font-weight:600;padding:3px 10px;border-radius:12px;background:var(--lav-2);color:var(--indigo)}
#modal h3{font-family:'Poppins';font-weight:700;font-size:16px;color:var(--navy);line-height:1.35;word-break:break-word;margin-bottom:16px}
#modal .mrow{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
#modal .mrow:last-child{border:none}
#modal .mk{color:var(--muted)}.mv{color:var(--navy);font-weight:500;text-align:right;word-break:break-word}
#modal .mact{margin-top:18px}
#modal .mact .btn{background:var(--indigo);color:#fff;border:none;font-family:'Poppins';font-weight:600;font-size:13px;padding:11px 20px;border-radius:22px}
#modal .mnote{background:var(--gold-wash);border:1px solid var(--gold-line);border-radius:12px;padding:13px 15px;font-size:12.5px;color:var(--gold-ink);line-height:1.55}

/* ---------- chargement + confirmation ---------- */
#loader{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center}
#loader.show{display:flex}
#loader .lback{position:absolute;inset:0;background:rgba(40,36,80,.4);backdrop-filter:blur(3px)}
#loader .lcard{position:relative;background:#fff;border-radius:16px;padding:24px 30px;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:16px;min-width:280px;max-width:80vw}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--lav-2);border-top-color:var(--indigo);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
#loader .lmsg{font-family:'Poppins';font-weight:500;font-size:14px;color:var(--navy)}
#confirm{position:fixed;inset:0;z-index:205;display:none}
#confirm.show{display:block}
#confirm .mback{position:absolute;inset:0;background:rgba(40,36,80,.34);backdrop-filter:blur(3px);animation:fade .2s ease}
#confirm .mcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);max-height:86vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:var(--sh-lg);padding:24px 26px;animation:pop .22s ease}
#confirm .mhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#confirm .mx{margin-left:auto;background:var(--lav);border:none;width:30px;height:30px;border-radius:9px;color:var(--muted);font-size:14px}
#confirm .mx:hover{background:var(--lav-2);color:var(--indigo)}
.csec{margin-top:18px}
.csec h4{font-family:'Poppins';font-weight:700;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--indigo);margin-bottom:8px}
.csec p{font-size:13.5px;color:var(--ink);line-height:1.55}.csec p b{color:var(--navy)}
.cl{font-size:11px;color:var(--muted);margin-bottom:6px}
.cchip{display:inline-block;background:var(--lav);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;margin:0 6px 6px 0;color:var(--ink-soft)}
.cchip b{color:var(--indigo);font-family:var(--mono)}
.clist{max-height:240px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:2px 15px}
.crow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.crow:last-child{border:none}.crow .cn{color:var(--navy);font-weight:500}
.crow .cd{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}
.cz{font-size:9px;font-family:'Poppins';font-weight:600;background:var(--gold-wash);color:var(--gold-ink);border-radius:8px;padding:1px 6px;vertical-align:middle}
#confirm .mact{margin-top:20px;display:flex;align-items:center;gap:14px}
#confirm .mact .btn{background:var(--indigo);color:#fff;border:none;font-family:'Poppins';font-weight:600;font-size:13px;padding:11px 20px;border-radius:22px}
#confirm .mact .btn:hover{background:var(--indigo-d)}

a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:8px}
@media(max-width:560px){.main{padding:24px 18px 60px}.hero{padding:32px 24px}.hero h1{font-size:26px}.cstats{gap:18px}.cstats .st .v{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ LOT 1 : cloche, profil, menus, modale enrichie, sous-modales, journal ============ */
.top .tools{margin-left:auto;display:flex;align-items:center;gap:14px}
.icobtn{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.14s}
.icobtn:hover{background:var(--lav-2);color:var(--indigo);border-color:var(--line-2)}
.ndot{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--magenta);color:#fff;font:700 10px/17px 'Poppins';text-align:center;box-shadow:0 0 0 2px #fff}
.prof{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:4px 12px 4px 4px;cursor:pointer;transition:.14s}
.prof:hover{background:var(--lav);border-color:var(--line-2)}
.prof .avatar{margin:0}
.prof .pmeta{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.prof .pmeta b{font:600 12.5px 'Poppins';color:var(--navy)}
.prof .pmeta i{font-style:normal;font-size:10.5px;color:var(--muted)}
@media(max-width:760px){.prof .pmeta{display:none}}
.dropdown{position:fixed;top:62px;right:24px;width:344px;max-height:72vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-lg);z-index:60;opacity:0;transform:translateY(-6px);pointer-events:none;transition:.16s}
.dropdown.show{opacity:1;transform:none;pointer-events:auto}

@media(max-width:620px){#modal .mact4{grid-template-columns:repeat(2,1fr)}}
/* sous-modales (export / classer / éditer / rôles) */
.sheet{position:fixed;inset:0;z-index:300;display:none}

.sheet .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sheet .chip{padding:7px 12px;border:1px solid var(--line-2);border-radius:20px;font-size:12.5px;cursor:pointer;transition:.12s}
.sheet .chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.sheet .row2{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}

.sheet .pbtn:hover{background:var(--indigo-d)}
.sheet .pbtn.sec{background:#fff;color:var(--muted);border:1px solid var(--line-2)}
.sheet .rlist{margin-top:12px}
.sheet .rrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--navy)}
.sheet .rrow .mlink{color:var(--indigo);cursor:pointer}
.backbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--filet,#E2DEF0);background:var(--lav,#F5F2FC);color:var(--indigo,#3B2E8C);font-weight:600;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer;margin-right:12px;white-space:nowrap}
.backbtn:hover{background:var(--indigo,#3B2E8C);color:#fff;border-color:var(--indigo,#3B2E8C)}
.mopen{margin:2px 0 10px}

.mopen .mbtn.open:hover{filter:brightness(1.08)}
.lspin{width:34px;height:34px;margin:10px auto 4px;border:3px solid var(--filet,#E2DEF0);border-top-color:var(--indigo,#3B2E8C);border-radius:50%;animation:lspinrot .8s linear infinite}
@keyframes lspinrot{to{transform:rotate(360deg)}}
.vwrap{position:fixed;inset:0;background:rgba(29,29,27,.45);z-index:9999;display:none}
.vwrap.on{display:block}
.vwin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1000px,86vw);height:82vh;display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:hidden}
.vwin.max{left:0!important;top:0!important;transform:none!important;width:100vw;height:100vh;border-radius:0;margin:0}
.vwin.min{height:auto!important}
.vwin.min .vframe{display:none}
.vbar{display:flex;align-items:center;gap:12px;background:var(--indigo,#3B2E8C);color:#fff;padding:8px 10px 8px 16px;cursor:move;user-select:none}
.vtt{flex:1;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vwc{display:flex;gap:6px}
.vb{width:30px;height:24px;border:0;border-radius:6px;background:rgba(255,255,255,.16);color:#fff;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vb:hover{background:rgba(255,255,255,.32)}
.vb.vx:hover{background:var(--magenta,#E91E63)}
.vframe{flex:1;width:100%;border:0;background:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;max-height:44vh;overflow:auto;margin:6px 0 2px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1px solid var(--line,#E2DEF0);border-radius:12px;background:var(--lav,#F5F2FC);color:var(--indigo,#3B2E8C);cursor:pointer;font-size:11.5px;font-weight:600;text-align:center;font-family:inherit}
.ptile:hover{background:var(--indigo,#3B2E8C);color:#fff}
.ptile.on{outline:2px solid var(--indigo,#3B2E8C);outline-offset:1px}
.ptile span{line-height:1.2;word-break:break-word}
.pcrumb{font-size:12px;color:var(--muted,#6E6A86);margin:2px 0 8px;font-weight:600}
.pbtn[disabled]{opacity:.45;cursor:not-allowed}
.pv-card{border:1px solid var(--filet,#E2DEF0);border-radius:14px;overflow:hidden;background:#fff}
.pv-card-h{display:flex;align-items:center;gap:14px;padding:18px 20px;background:linear-gradient(135deg,var(--lav,#F5F2FC),#fff);border-bottom:1px solid var(--filet,#E2DEF0)}
.pv-card-ic{width:46px;height:46px;border-radius:12px;background:var(--indigo,#3B2E8C);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.pv-card-ic svg{width:24px;height:24px}
.pv-card-t{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:var(--navy,#1D1D1B);line-height:1.3;word-break:break-word}
.pv-card-m{font-size:12px;color:var(--indigo,#3B2E8C);font-weight:600;margin-top:3px}
.pv-card-x{padding:14px 20px}
.pv-card-lbl{font-family:'Poppins',sans-serif;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted,#6E6A86);font-weight:600;margin-bottom:6px}
.pv-card-x p{margin:0;font-size:12.5px;line-height:1.6;color:#4a4668;max-height:190px;overflow:auto;word-break:break-word}
.pv-card-note{padding:12px 20px 16px;font-size:12px;line-height:1.5;color:var(--muted,#6E6A86);border-top:1px solid var(--filet,#E2DEF0);background:var(--lav,#F5F2FC)}
.pv-load{display:flex;align-items:center;justify-content:center;min-height:180px;color:var(--muted,#6E6A86);font-size:13px;font-weight:600;border:1px solid var(--filet,#E2DEF0);border-radius:14px;background:var(--lav,#F5F2FC)}

/* ===================== THÈME SOMBRE — style armonie landing ===================== */
:root{
 --navy:#eef1fb; --indigo:#9d8dff; --indigo-d:#8b7bf0;
 --ink:#eef1fb; --ink-soft:#c7cce6; --muted:#9aa3c7;
 --bg:#131832; --card:#1a2040;
 --lav:rgba(255,255,255,.05); --lav-2:rgba(255,255,255,.09);
 --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.17);
 --magenta:#ff5c9d; --m-wash:rgba(255,92,157,.14); --green:#3ddc97;
 --gold:#F2C316; --gold-wash:rgba(242,195,22,.14); --gold-line:rgba(242,195,22,.35); --gold-ink:#F2C316;
 --sh-sm:0 1px 2px rgba(0,0,0,.3); --sh-md:0 14px 34px -16px rgba(0,0,0,.55); --sh-lg:0 34px 80px -28px rgba(0,0,0,.65);
}
html,body{background:radial-gradient(1200px 620px at 18% -12%,#2a3160 0%,transparent 60%),linear-gradient(160deg,#1a2142,#141a35 45%,#0f1329);background-attachment:fixed;color:var(--ink)}
.mockbar{background:rgba(255,255,255,.05);color:var(--ink-soft);border-bottom:1px solid var(--line)}
.top{background:rgba(16,20,42,.78);border-bottom:1px solid var(--line)}
.search input{background:rgba(255,255,255,.06);border-color:var(--line-2);color:var(--ink)}
.search input::placeholder{color:#8b93b8}
.backbtn{background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--ink-soft)}
.backbtn:hover{background:rgba(255,255,255,.10)}
#sfver{background:rgba(255,255,255,.06)!important;border-color:var(--line-2)!important;color:var(--muted)!important}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border:2px solid transparent}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}
/* hero + mot en dégradé */
.hero{background:transparent;border:0;box-shadow:none;padding:8px 0 0}
.hero h1 .g{background:linear-gradient(90deg,#5aa8ff,#37d0c4);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .n{background:linear-gradient(90deg,#5aa8ff,#37d0c4);-webkit-background-clip:text;background-clip:text;color:transparent}
/* encarts cliquables */
.tile,.ccard,.pchip{background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--line)}
.tile:hover,.ccard:hover,.pchip:hover{border-color:var(--line-2);box-shadow:var(--sh-md)}
.tile .ic{background:rgba(255,255,255,.08)}
.eyebrow{color:#bcd0ff}
.navi.active{background:linear-gradient(135deg,#6b5ce0,#8b7bf0);color:#fff}

/* tableaux */
.tbl{background:rgba(255,255,255,.03);border:1px solid var(--line)}
.tbl thead th{background:rgba(255,255,255,.06);color:var(--ink-soft)}
.tbl tbody td{border-bottom:1px solid var(--line)}
.tbl tbody tr:hover{background:rgba(255,255,255,.05)}
.tbl .path,.tbl .name .nm{color:var(--ink-soft)}
.tag{background:rgba(255,255,255,.08);color:#c9c0ff}
.tag.t{background:rgba(255,255,255,.06);color:var(--ink-soft)}
.tag.x{background:var(--gold-wash);color:var(--gold)}
.more{background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:var(--ink)}
.more:hover{background:rgba(255,255,255,.10)}
.empty{background:rgba(255,255,255,.03);border:1px dashed var(--line-2);color:var(--muted)}
/* dépôt */
.dz{background:rgba(255,255,255,.03);border:2px dashed var(--line-2)}
.dz.drag{background:rgba(157,141,255,.14);border-color:var(--indigo)}
.dzbadge.ok{background:rgba(61,220,151,.14);color:var(--green)}
/* modales / tiroirs / viewer / menus */
#modal .mback,.vwrap{background:rgba(6,9,22,.62);backdrop-filter:blur(3px)}
#modal .mcard,.mcard,.dropdown,.vwin,.sheet .sc{background:#1a2040;border:1px solid var(--line);color:var(--ink);box-shadow:var(--sh-lg)}

.sheet .fld,.sheet textarea.fld{background:rgba(255,255,255,.06);border-color:var(--line-2);color:var(--ink)}
.sheet .chip{background:rgba(255,255,255,.06);color:var(--ink-soft)}
.sheet .opt{border-color:var(--line-2)}
.vbar{background:rgba(255,255,255,.05);border-bottom:1px solid var(--line);color:var(--ink)}
.dropdown .di{border-top:1px solid var(--line)}
.dropdown .di:hover{background:rgba(255,255,255,.05)}
.pv-card,.pv-load{border-color:var(--line-2)!important;background:rgba(255,255,255,.04)!important;color:var(--ink-soft)!important}

.filters select,.filters .fsearch{background:rgba(255,255,255,.06);border-color:var(--line-2);color:var(--ink)}

.prof{background:rgba(255,255,255,.05);border-color:var(--line-2)}

.badge.contrat{background:rgba(255,255,255,.06);color:var(--ink-soft);border-color:var(--gold-line)}
.sheet .pbtn.sec{background:rgba(255,255,255,.06);color:var(--ink-soft);border-color:var(--line-2)}
#loader .lcard{background:#1a2040;color:var(--ink)}
.tile .cnt{color:var(--ink)}
.mact4 .mbtn,#modal .mact4 .mbtn{background:rgba(255,255,255,.06);color:var(--ink-soft);border-color:var(--line-2)}
.mact4 .mbtn:hover,#modal .mact4 .mbtn:hover{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.mopen .mbtn.open,#modal .mopen .mbtn.open{background:var(--indigo);color:#fff;border-color:var(--indigo)}
#confirm .mcard{background:#1a2040;border:1px solid var(--line);color:var(--ink);box-shadow:var(--sh-lg)}
#confirm .mback{background:rgba(6,9,22,.6);backdrop-filter:blur(3px)}
#confirm .csec{border-color:var(--line)}
#confirm .clist,#confirm .crow{border-color:var(--line)}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');
const STOP=new Set(["de","des","du","la","le","les","groupe","france","and","of"]);
function initials(name){
  const w=name.replace(/[—–-]/g," ").split(/\s+/).filter(x=>x.length>1&&!STOP.has(x.toLowerCase()));
  let s=(w.length>=2)?(w[0][0]+w[1][0]):(w[0]?w[0].slice(0,2):"?");
  return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
}
const engClass=c=>c==='projet'?'projet':c==='both'?'both':'assist';
const engText=c=>c==='both'?'Assistance + Projet':c==='assist'?'Assistance':'Projet';

/* noms de fichiers : titre lisible + extension */
function extOf(n){const m=String(n==null?'':n).match(/\.([A-Za-z0-9]{1,6})$/);return m?m[1].toLowerCase():'';}
function baseName(n){const e=extOf(n);return e?String(n).slice(0,-(e.length+1)):String(n);}
/* journal des mouvements + notifications */
const MOV_KEY='armonie_mov_v1',SEEN_KEY='armonie_mov_seen_v1';
let MOV=[];try{MOV=JSON.parse(localStorage.getItem(MOV_KEY)||'[]')||[];}catch(e){MOV=[];}
let MOV_SEEN=0;try{MOV_SEEN=parseInt(localStorage.getItem(SEEN_KEY)||'0',10)||0;}catch(e){}
function saveMov(){try{localStorage.setItem(MOV_KEY,JSON.stringify(MOV.slice(0,600)));}catch(e){}}
function logMove(a,n,s){const e={t:Date.now(),who:'ND',a:a,n:n||'',s:s||''};MOV.unshift(e);saveMov();try{updateBell();}catch(_){}try{syncPushMov(e);}catch(_){}}
function relTime(ts){const s=(Date.now()-ts)/1000;if(s<60)return"à l'instant";if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';if(s<604800)return Math.floor(s/86400)+' j';return new Date(ts).toLocaleDateString('fr-FR');}
function unseen(){return MOV.filter(m=>m.t>MOV_SEEN).length;}
/* ---- synchro serveur (mode hébergé cp|WIRE) : partage journal + rôles ---- */
const SYNC={on:false,base:'/api/sharefly',_poll:null};
function saveRoles(R){try{localStorage.setItem('armonie_roles_v1',JSON.stringify(R));}catch(e){}try{syncPushRoles(R);}catch(e){}}
async function syncInit(){
  if(typeof fetch!=='function'||location.protocol==='file:')return;
  try{
    const r=await fetch(SYNC.base+'/state',{cache:'no-store'});
    if(!r.ok)return;
    const st=await r.json();
    SYNC.on=true;
    if(Array.isArray(st.mov)){MOV=st.mov;saveMov();}
    if(Array.isArray(st.roles)){try{localStorage.setItem('armonie_roles_v1',JSON.stringify(st.roles));}catch(e){}}
    updateBell();
    if(((location.hash||'').replace(/^#\/?/,'').split('/')[0])==='journal')renderJournal();
    if(!SYNC._poll)SYNC._poll=setInterval(syncPoll,20000);
  }catch(e){/* pas d'API : mode local */}
}
async function syncPoll(){
  if(!SYNC.on||typeof fetch!=='function')return;
  try{const r=await fetch(SYNC.base+'/state',{cache:'no-store'});if(!r.ok)return;const st=await r.json();
    if(Array.isArray(st.mov)&&st.mov.length!==MOV.length){MOV=st.mov;saveMov();updateBell();
      if(((location.hash||'').replace(/^#\/?/,'').split('/')[0])==='journal')renderJournal();}
  }catch(e){}
}
function syncPushMov(entry){if(!SYNC.on||typeof fetch!=='function')return;try{fetch(SYNC.base+'/mov',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)});}catch(e){}}
function syncPushRoles(R){if(!SYNC.on||typeof fetch!=='function')return;try{fetch(SYNC.base+'/roles',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(R)});}catch(e){}}

/* ---------- stockage binaire persistant (IndexedDB, avec repli) ---------- */
const IDB={db:null,ok:false};
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('armonie_delivery',1);
  r.onupgradeneeded=e=>{e.target.result.createObjectStore('files');};
  r.onsuccess=e=>{IDB.db=e.target.result;IDB.ok=true;res(true);};
  r.onerror=()=>res(false);r.onblocked=()=>res(false);}catch(e){res(false);}});}
function idbPut(id,blob){return new Promise(res=>{if(!IDB.ok)return res(false);try{
  const tx=IDB.db.transaction('files','readwrite');tx.objectStore('files').put(blob,id);
  tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});}
function idbGet(id){return new Promise(res=>{if(!IDB.ok)return res(null);try{
  const rq=IDB.db.transaction('files','readonly').objectStore('files').get(id);
  rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);}catch(e){res(null);}});}
function idbDel(id){return new Promise(res=>{if(!IDB.ok)return res(false);try{
  const tx=IDB.db.transaction('files','readwrite');tx.objectStore('files').delete(id);
  tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});}
function idbClear(){return new Promise(res=>{if(!IDB.ok)return res(false);try{
  const tx=IDB.db.transaction('files','readwrite');tx.objectStore('files').clear();
  tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});}

// charge le vrai fichier (blob) depuis le stockage et l'affiche rendu (PDF/image/html)
async function renderPreviewAsync(d,ex,box){
  if(!box||!d._added)return;
  ex=(ex||extOf(d.n)||'').toLowerCase();
  const IMG=['png','jpg','jpeg','gif','webp','bmp','svg'];
  if(!(ex==='pdf'||ex==='html'||ex==='htm'||IMG.includes(ex)))return; // Office & co : on garde la carte
  let u=BLOBS[d._id];
  if(!u){try{const b=await idbGet(d._id);if(b){u=URL.createObjectURL(b);BLOBS[d._id]=u;}}catch(_){}}
  if(!u&&d._text&&(ex==='html'||ex==='htm')){try{u=URL.createObjectURL(new Blob([d._text],{type:'text/html'}));BLOBS[d._id]=u;}catch(_){}}
  if(!u){box.innerHTML=previewCard(d,ex,"Le fichier réel n'est pas disponible sur ce poste. Réimporte-le pour l'aperçu, ou clique <b>Ouvrir le document</b>.");return;}
  if(IMG.includes(ex))box.innerHTML=`<img class="pv-img" src="${u}" alt="">`;
  else if(ex==='pdf')box.innerHTML=`<embed class="pv-pdf" src="${u}" type="application/pdf">`;
  else box.innerHTML=`<iframe class="pv-pdf" src="${u}" title="Aperçu" style="width:100%;height:420px;border:0;border-radius:10px;background:#fff"></iframe>`;
}
function looksBinary(t){
  if(!t)return false;
  const s=t.slice(0,300);
  if(/^%PDF|^PK\x03\x04|^\x89PNG|^GIF8|^\xFF\xD8\xFF|^\uFFFD/.test(s))return true;
  let bad=0;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(c===0||(c<9)||(c>13&&c<32)||c===0xFFFD)bad++;}
  return bad/Math.max(1,s.length)>0.08;
}

/* ouvrir le document : fichier déposé (blob) · dérivé cp|WIRE · lien profond SharePoint */
// URL du contenu d'un doc cp|WIRE : celle stockée, sinon reconstruite depuis le nom
// (robuste aux catalogues générés par une ancienne version, sans url)
function cpwireUrl(d){
  if(!d)return null;
  if(d.url)return d.url;
  if(d.src!=='cpwire')return null;
  const nm=d.n||'';let m2;
  if((m2=nm.match(/^Fiche dossier — (.+)$/)))return '/api/sharefly/view/fiche/'+encodeURIComponent(m2[1].trim());
  if((m2=nm.match(/^Mémoire IA — (.+?)(?:\s*\(\d+[^)]*\))?$/)))return '/api/sharefly/view/memoire/'+encodeURIComponent(m2[1].trim());
  return null;
}
async function openFile(d){

  {const cu=cpwireUrl(d);if(cu){openInApp(cu,d.n);return;}}

  sheet(`<h4>Référence SharePoint</h4>
    <p class="sub">« ${esc(baseName(d.n))} » est une <b>référence</b> du catalogue SharePoint. Son contenu n'est pas encore rapatrié dans ShareFly.</p>

// Lecteur de document INTÉGRÉ à ShareFly (aucun renvoi externe).
function openInApp(url,title){
  let v=document.getElementById('vwrap');
  if(!v){
    v=document.createElement('div');v.id='vwrap';v.className='vwrap';
    v.innerHTML='<div class="vwin" id="vwin"><div class="vbar" id="vbar"><span class="vtt" id="vtt"></span><span class="vwc"><button class="vb" id="vmin" title="Réduire" type="button">_</button><button class="vb" id="vmax" title="Agrandir / restaurer" type="button">☐</button><button class="vb vx" id="vcl" title="Fermer" type="button">✕</button></span></div><iframe class="vframe" id="vframe" title="Document"></iframe></div>';
    document.body.appendChild(v);
    const win=v.querySelector('#vwin');
    const close=()=>{v.classList.remove('on');v.querySelector('#vframe').src='about:blank';win.classList.remove('min','max');win.style.left='';win.style.top='';win.style.transform='';win.style.margin='';};
    v.querySelector('#vcl').onclick=close;
    v.querySelector('#vmin').onclick=()=>win.classList.toggle('min');
    v.querySelector('#vmax').onclick=()=>{win.classList.remove('min');win.classList.toggle('max');win.style.left='';win.style.top='';win.style.transform='';win.style.margin='';};
    v.addEventListener('click',e=>{if(e.target===v)close();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&v.classList.contains('on'))close();});
    // glisser la fenêtre via la barre de titre
    const bar=v.querySelector('#vbar');let drag=false,ox=0,oy=0;
    bar.addEventListener('mousedown',e=>{
      if(e.target.closest('.vb'))return;              // pas sur les boutons
      if(win.classList.contains('max'))return;        // pas en plein écran
      const r=win.getBoundingClientRect();
      win.style.transform='none';win.style.margin='0';win.style.left=r.left+'px';win.style.top=r.top+'px';
      ox=e.clientX-r.left;oy=e.clientY-r.top;drag=true;document.body.style.userSelect='none';
    });
    document.addEventListener('mousemove',e=>{if(!drag)return;win.style.left=Math.max(0,Math.min(window.innerWidth-80,e.clientX-ox))+'px';win.style.top=Math.max(0,Math.min(window.innerHeight-40,e.clientY-oy))+'px';});
    document.addEventListener('mouseup',()=>{if(drag){drag=false;document.body.style.userSelect='';}});
  }
  v.querySelector('#vtt').textContent=title||'Document';
  v.querySelector('#vframe').src=url;
  v.querySelector('#vwin').classList.remove('min');
  v.classList.add('on');
}
function docAction(a,d,m){
  if(a==='open'){openFile(d);return;}
  if(a==='chart'){try{const blob=new Blob([chartFiche(d)],{type:'text/html'});openInApp(URL.createObjectURL(blob),'Version Armonie — '+baseName(d.n));}catch(e){toast('Génération impossible : '+(e.message||e));}return;}
  if(a==='spimport'){if(m)m.classList.remove('show');importForReference(d);return;}
  if(a==='refresh'){openDoc(d);toast('Actualisé');return;}
  if(a==='export'){openExport(d);return;}
  if(a==='edit'){openEdit(d);return;}
  if(a==='import'){const inp=m.querySelector('#mimp');inp.value='';inp.onchange=async()=>{if(inp.files&&inp.files[0]){const f=inp.files[0];m.classList.remove('show');await processFiles([f]);logMove('Import',f.name,d.client||'');toast('Fichier importé');}};inp.click();return;}
}

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
/* enregistre un blob en laissant l'utilisateur CHOISIR l'emplacement (File System Access API),
   avec repli téléchargement classique. Retourne true si enregistré, false si annulé. */
async function saveBlob(blob,name){
  try{
    if(window.showSaveFilePicker){
      const ext=(String(name).split('.').pop()||'').toLowerCase();
      const acc={}; acc[blob.type||'application/octet-stream']=['.'+ext];
      let h;
      try{h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Fichier',accept:acc}]});}
      catch(e){if(e&&e.name==='AbortError')return false;throw e;}
      const w=await h.createWritable();await w.write(blob);await w.close();return true;
    }
    dl(blob,name);return true;                 // repli : dossier de téléchargement du navigateur
  }catch(e){toast('Enregistrement échoué : '+(e.message||e));return false;}
}
async function exportBrut(d){let b=null;try{b=await idbGet(d._id);}catch(_){}if(!b){toast('Fichier brut indisponible');return false;}return await saveBlob(b,d.n);}

    <div class="opt ${canFile?'':'dis'}" data-x="brut"><div><b>Fichier brut</b><small>${canFile?"Le fichier d'origine, tel quel.":"Indisponible : fichier réel absent de ce poste."}</small></div></div>

    <div class="opt" data-x="charte"><div><b>Fiche en charte Armonie (HTML → PDF)</b><small>Document habillé aux couleurs Armonie, prêt à imprimer.</small></div></div>
    <p class="sub" style="margin-top:8px">Mise en charte d'un fichier Office existant : via le pipeline (hébergement) — lot suivant.</p>
    <div class="row2"><button class="pbtn sec" data-x="cancel">Fermer</button></div>`;
  sheet(html,(s,close)=>{

      const x=o.dataset.x;

      const label=x==='brut'?'Fichier brut':x==='csv'?'Fiche métadonnées (CSV)':'Fiche charte Armonie';
      sheet(`<h4>Export en cours…</h4><p class="sub">Choisis l'emplacement d'enregistrement dans la fenêtre du navigateur.</p><div class="lspin"></div>`);
      let ok=false;
      try{ ok = x==='brut'?await exportBrut(d):x==='csv'?await exportFicheCsv(d):await exportCharte(d); }catch(e){ ok=false; }
      if(ok){
        logMove('Export ('+label+')',d.n,d.client||'');
        const note=x==='charte'?'<p class="sub">Ouvre le fichier puis Imprimer › Enregistrer en PDF.</p>':'';
        sheet(`<h4>✓ Export terminé</h4><p class="sub">${esc(label)} — «\u00a0${esc(baseName(d.n))}\u00a0» enregistré.</p>${note}<div class="row2"><button class="pbtn" data-x="ok">Fermer</button></div>`,(s2,c2)=>{s2.querySelector('[data-x="ok"]').onclick=c2;});
      }else{
        sheet(`<h4>Export annulé</h4><p class="sub">Aucun fichier enregistré.</p><div class="row2"><button class="pbtn sec" data-x="ok">Fermer</button></div>`,(s2,c2)=>{s2.querySelector('[data-x="ok"]').onclick=c2;});
      }
    });
    s.querySelector('[data-x="cancel"]').onclick=close;
  });
}

function openClassify(d){
  const CATS=['Contrats','Factures','Comptes rendus','Spécifications','Cahier des charges','Livrables','Gouvernance','Échanges client','Divers'];
  const spaceList=(window.SPACES||[]).map(s=>({key:s.key,name:s.name}));
  const sel={sp:null,ci:(d.ci>=0?d.ci:null),k:(d.k&&d.k!=='(à classer)')?d.k:null};
  const F='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  function destPath(){
    if(sel.sp==='clients'&&sel.ci!=null&&CLIENTS[sel.ci]) return 'CLIENTS/'+CLIENTS[sel.ci].name+(sel.k?'/'+sel.k:'');
    const s=spaceList.find(x=>x.key===sel.sp); return (s?s.name:sel.sp||'')+(sel.k?'/'+sel.k:'');
  }
  function render(){
    const crumb=['Racine'];
    if(sel.sp){const s=spaceList.find(x=>x.key===sel.sp);crumb.push(s?s.name:sel.sp);}
    if(sel.ci!=null&&CLIENTS[sel.ci])crumb.push(CLIENTS[sel.ci].name);
    if(sel.k)crumb.push(sel.k);
    let step='',grid='';
    if(!sel.sp){step='Choisis un espace';grid=spaceList.map(s=>`<button class="ptile" data-sp="${esc(s.key)}">${F}<span>${esc(s.name)}</span></button>`).join('');}
    else if(sel.sp==='clients'&&sel.ci==null){step='Choisis un client';grid=CLIENTS.map((c,i)=>`<button class="ptile" data-ci="${i}">${F}<span>${esc(c.name)}</span></button>`).join('');}
    else {step='Choisis une catégorie';grid=CATS.map(c=>`<button class="ptile ${sel.k===c?'on':''}" data-k="${esc(c)}">${F}<span>${esc(c)}</span></button>`).join('');}
    const canMove = !!(sel.sp && (sel.sp!=='clients' || sel.ci!=null) && sel.k);
    const html=`<h4>Classer — ${esc(baseName(d.n))}</h4>
      <div class="pcrumb">${crumb.map(esc).join(' › ')}</div>
      <p class="sub">${step}</p>
      <div class="pgrid">${grid}</div>
      <div class="row2" style="margin-top:14px">
        ${sel.sp?'<button class="pbtn sec" data-x="back">↑ Remonter</button>':'<button class="pbtn sec" data-x="c">Annuler</button>'}
        <button class="pbtn" data-x="move" ${canMove?'':'disabled'}>Déplacer ici</button>
      </div>`;
    sheet(html,(s,close)=>{
      s.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{sel.sp=b.dataset.sp;if(sel.sp!=='clients')sel.ci=null;sel.k=null;render();});
      s.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{sel.ci=+b.dataset.ci;sel.k=null;render();});
      s.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sel.k=b.dataset.k;render();});
      const bk=s.querySelector('[data-x="back"]');if(bk)bk.onclick=()=>{if(sel.k)sel.k=null;else if(sel.ci!=null)sel.ci=null;else sel.sp=null;render();};
      const cc=s.querySelector('[data-x="c"]');if(cc)cc.onclick=close;
      const mv=s.querySelector('[data-x="move"]');if(mv&&canMove)mv.onclick=()=>{
        const dest=destPath();
        sheet(`<h4>Déplacer le document ?</h4><p class="sub">« ${esc(baseName(d.n))} » sera classé dans :</p><p class="sub" style="color:var(--indigo,#3B2E8C);font-weight:700">${esc(dest)}</p><div class="row2" style="margin-top:14px"><button class="pbtn sec" data-x="no">Retour</button><button class="pbtn" data-x="yes">Confirmer le déplacement</button></div>`,(s2,c2)=>{
          s2.querySelector('[data-x="no"]').onclick=()=>{c2();render();};
          s2.querySelector('[data-x="yes"]').onclick=()=>{
            d.sp=sel.sp;
            if(sel.sp==='clients'&&sel.ci!=null){d.ci=sel.ci;d.client=CLIENTS[sel.ci].name;}
            d.k=sel.k||d.k;
            d.p=dest+'/'+d.n;
            try{saveAdded();}catch(_){}
            try{logMove('Classé',d.n,d.client||'');}catch(_){}
            c2();
            toast('Document classé : '+dest);
            try{if((location.hash||'').includes('depot'))renderDepot();else if(typeof route==='function')route();}catch(_){}
            openDoc(d);
          };
        });
      };
    });
  }
  render();
}

function mountDocs(host, baseList, opts){
  opts=opts||{};
  const years=uniq(baseList,'y'), types=[...new Set(baseList.map(d=>d.x))].sort();
  const cats=opts.cats? [...new Set(baseList.map(d=>d.k).filter(Boolean))].sort() : null;
  const engs=opts.eng? ['Assistance','Projet'] : null;
  let state={q:'',y:'',x:'',k:opts.k||'',e:''};
  let shown=50;
  const wrap=document.createElement('div');
  let fh='<div class="filters">';
  fh+=`<input class="fsearch" id="fq" placeholder="Filtrer par nom…">`;
  if(cats){fh+=`<select id="fk"><option value="">Toutes catégories</option>`+cats.map(c=>`<option ${c===state.k?'selected':''}>${esc(c)}</option>`).join('')+`</select>`;}
  if(engs){fh+=`<select id="fe"><option value="">Tout engagement</option>`+engs.map(c=>`<option>${c}</option>`).join('')+`</select>`;}
  fh+=`<select id="fx"><option value="">Tous types</option>`+types.map(t=>`<option>${esc(t)}</option>`).join('')+`</select>`;
  fh+=`<select id="fy"><option value="">Toutes années</option>`+years.map(y=>`<option>${y}</option>`).join('')+`</select>`;
  fh+=`<button class="reset" id="freset">réinitialiser</button>`;
  fh+=`<span class="count" id="fcount"></span></div>`;
  wrap.innerHTML=fh+`<div id="tblhost"></div>`;
  host.appendChild(wrap);

  function filtered(){
    return baseList.filter(d=>
      (!state.q||d.n.toLowerCase().includes(state.q))&&
      (!state.y||String(d.y)===state.y)&&
      (!state.x||d.x===state.x)&&
      (!state.k||d.k===state.k)&&
      (!state.e||d.e===state.e));
  }
  function draw(){
    const list=filtered();
    const part=list.slice(0,shown);
    let h=`<table class="tbl"><thead><tr><th>Nom</th>`+
      (cats?'<th>Catégorie</th>':'')+(engs?'<th>Engagement</th>':'')+
      `<th>Type</th><th>Année</th></tr></thead><tbody>`;
    part.forEach(d=>{
      const ex=extOf(d.n),extlbl=ex?('.'+ex):'—';
      h+=`<tr><td><div class="name">${I.doc}<span class="nm" title="${esc(d.n)}">${esc(baseName(d.n))}</span>${d._added?'<span class="dzbadge ok" style="margin-left:8px">ajouté</span>':''}</div><div class="path">${esc(d.p)}</div></td>`+
        (cats?`<td>${d.k?`<span class="tag">${esc(d.k)}</span>`:'—'}</td>`:'')+
        (engs?`<td>${engBadge(d.e)||'—'}</td>`:'')+
        `<td><span class="tag t" title="${esc(d.x)}"><i style="background:${typeColor(d.x)}"></i>${esc(extlbl)}</span><span class="tsub">${esc(d.x)}</span></td><td class="mono" style="color:var(--muted)">${d.y||'—'}</td></tr>`;
    });
    h+='</tbody></table>';
    if(list.length===0) h='<div class="empty">Aucun document ne correspond à ces filtres.</div>';
    else if(list.length>shown) h+=`<button class="more" id="more">Afficher plus (${fmt(list.length-shown)} restants)</button>`;
    $('#tblhost').innerHTML=h;
    $('#fcount').textContent=fmt(list.length)+' document'+(list.length>1?'s':'');
    const mb=$('#more'); if(mb) mb.onclick=()=>{shown+=100;draw();};
    $('#tblhost').querySelectorAll('tbody tr').forEach((tr,ix)=>{tr.onclick=()=>openDoc(part[ix]);});
  }
  const fq=wrap.querySelector('#fq');
  fq.oninput=()=>{state.q=fq.value.toLowerCase();shown=50;draw();};
  ['fk','fe','fx','fy'].forEach(id=>{const el=wrap.querySelector('#'+id);if(el)el.onchange=()=>{state[id[1]]=el.value;shown=50;draw();};});
  if(wrap.querySelector('#fk')&&state.k)wrap.querySelector('#fk').value=state.k;
  wrap.querySelector('#freset').onclick=()=>{state={q:'',y:'',x:'',k:'',e:''};shown=50;
    wrap.querySelectorAll('select').forEach(s=>s.value='');fq.value='';draw();};
  draw();
}

}

function dznorm(s){return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ');}
function dzClient(t){const n=' '+dznorm(t)+' ';for(const cl in DZ_CLIENTS){for(let a of DZ_CLIENTS[cl]){a=dznorm(a).trim();if(a&&(a.length>3?n.includes(a):n.includes(' '+a+' ')))return cl;}}return null;}
function dzCat(t){const n=' '+dznorm(t)+' ';for(const[kws,cat]of DZ_CATS){for(let k of kws){k=dznorm(k).trim();if(k&&(k.length>3?n.includes(k):n.includes(' '+k+' ')))return cat;}}return '(à classer)';}

  if(cl){const cat=dzCat(name+' '+(text||''));return{client:cl,cat,dest:`CLIENTS/${cl}/${cat}`};}
  return{client:null,cat:'(à classer)',dest:'_A-TRIER/(client inconnu)'};}

/* ============ Extraction universelle + intégration (dépôt) ============ */
const _dTxt=(u8,l)=>new TextDecoder('utf-8',{fatal:false}).decode(u8).slice(0,l||6000);
const _dL1=u8=>new TextDecoder('latin1').decode(u8);
const _eL1=s=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;return a;};
const _stripXml=s=>s.replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();
async function _inflate(u8,fmt){const ds=new DecompressionStream(fmt);const st=new Blob([u8]).stream().pipeThrough(ds);return new Uint8Array(await new Response(st).arrayBuffer());}
async function unzip(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let eo=-1;const min=Math.max(0,u8.length-22-65536);
  for(let i=u8.length-22;i>=min;i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}}
  if(eo<0)throw new Error('zip invalide');
  const cnt=dv.getUint16(eo+10,true);let off=dv.getUint32(eo+16,true);const out=[];
  for(let n=0;n<cnt;n++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),nameLen=dv.getUint16(off+28,true),extraLen=dv.getUint16(off+30,true),commLen=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+nameLen));
    const lnameLen=dv.getUint16(lho+26,true),lextraLen=dv.getUint16(lho+28,true),ds=lho+30+lnameLen+lextraLen,comp=u8.subarray(ds,ds+csize);
    let data;if(method===0)data=comp.slice();else if(method===8){try{data=await _inflate(comp,'deflate-raw');}catch(e){data=new Uint8Array(0);}}else data=new Uint8Array(0);
    if(!name.endsWith('/'))out.push({name,data});
    off+=46+nameLen+extraLen+commLen;
  }
  return out;
}
async function _ooxml(u8,kind){const files=await unzip(u8);const pick=re=>files.filter(f=>re.test(f.name));
  if(kind==='docx'){const d=files.find(f=>f.name==='word/document.xml');return d?_stripXml(_dTxt(d.data,200000)):'';}
  if(kind==='pptx')return pick(/^ppt\/slides\/slide\d+\.xml$/).map(f=>_stripXml(_dTxt(f.data,60000))).join(' ');
  if(kind==='xlsx'){const sh=files.find(f=>f.name==='xl/sharedStrings.xml');const a=sh?_stripXml(_dTxt(sh.data,200000)):'';const b=pick(/^xl\/worksheets\/sheet\d+\.xml$/).map(f=>_stripXml(_dTxt(f.data,100000))).join(' ');return (a+' '+b).trim();}
  return '';}
function _pdfOps(s){let out='';const re=/\((?:\\.|[^()\\])*\)\s*Tj|\[(?:[^\]\\]|\\.)*\]\s*TJ/g;const found=s.match(re)||[];for(const f of found){const ps=f.match(/\((?:\\.|[^()\\])*\)/g)||[];for(const p of ps)out+=p.slice(1,-1).replace(/\\([()\\])/g,'$1')+' ';}return out;}
async function _pdf(u8){try{const s=_dL1(u8);let text='';const re=/stream\r?\n([\s\S]*?)\r?\nendstream/g;let m,c=0;while((m=re.exec(s))&&c<50){c++;let dec=null;try{dec=await _inflate(_eL1(m[1]),'deflate');}catch(e){}text+=_pdfOps(dec?_dL1(dec):m[1])+' ';}text+=_pdfOps(s);return text.replace(/\s+/g,' ').trim().slice(0,4000);}catch(e){return '';}}
async function extractAny(name,u8){const ext=name.includes('.')?name.split('.').pop().toLowerCase():'';
  if(['txt','csv','md','log','json','xml','html','htm','tsv','ini','yaml','yml','sql'].includes(ext))return _dTxt(u8,6000);
  if(ext==='docx')return _ooxml(u8,'docx');if(ext==='pptx')return _ooxml(u8,'pptx');
  if(ext==='xlsx'||ext==='xlsm')return _ooxml(u8,'xlsx');if(ext==='pdf')return _pdf(u8);return '';}

function classifyDetailed(name,text){let where='nom';let cl=dzClient(name);if(!cl&&text){cl=dzClient(text);if(cl)where='contenu';}const cat=cl?dzCat(name+' '+(text||'')):'(à classer)';return{client:cl,cat,where};}
function makeDoc(name,text,size,fromZip){const r=classifyDetailed(name,text);const ci=r.client?CLIENTS.findIndex(c=>c.name===r.client):-1;

async function _readU8(file){return new Uint8Array(await file.arrayBuffer());}
async function _expand(name,u8,fromZip,acc,depth){
  if(depth<3 && name.toLowerCase().endsWith('.zip')){setLoad('Décompression de '+name+'…');

  acc.push({name,u8,fromZip});
}
async function _readDirEntries(dirHandle,out,depth){
  if(depth>6)return;
  for await(const [,handle] of dirHandle.entries()){
    if(handle.kind==='file'){try{out.push(await handle.getFile());}catch(_){}}
    else if(handle.kind==='directory'){await _readDirEntries(handle,out,depth+1);}
  }
}

async function processFiles(fileList,opts){

  let i=0;
  for(const a of acc){i++;setLoad(`Analyse ${i}/${acc.length} : ${a.name}`);
    let text='';try{text=await extractAny(a.name,a.u8);}catch(_){}

    const doc=makeDoc(a.name,text,a.u8.length,a.fromZip);
    if(opts.classify){const c=opts.classify;if(c.ci>=0){doc.ci=c.ci;doc.client=(CLIENTS[c.ci]&&CLIENTS[c.ci].name)||c.client||doc.client;}if(c.k)doc.k=c.k;if(c.sp)doc.sp=c.sp;doc.p=`CLIENTS/${doc.client||'—'}/${doc.k||'Divers'}/${baseName(doc.n)}`;if(c.refKey)doc._refKey=c.refKey;doc._where='référence';}
    else{const ref=findReference(doc.n);if(ref){if(ref.ci>=0){doc.ci=ref.ci;doc.client=(CLIENTS[ref.ci]&&CLIENTS[ref.ci].name)||ref.client||doc.client;}if(ref.k)doc.k=ref.k;if(ref.sp)doc.sp=ref.sp;doc.p=`CLIENTS/${doc.client||'—'}/${doc.k||'Divers'}/${baseName(doc.n)}`;doc._refKey=refKeyOf(ref);doc._where='référence';}}
    try{const blob=new Blob([a.u8]);BLOBS[doc._id]=URL.createObjectURL(blob);doc._stored=await idbPut(doc._id,blob);}catch(_){}
    window.ADDED.unshift(doc);results.push(doc);logMove('Dépôt',doc.n,(doc.client||'À trier')+(doc.k?' · '+doc.k:''));
  }
  saveAdded();closeLoader();
  if((location.hash||'').replace(/^#\/?/,'').startsWith('depot'))renderDepot();
  if(!opts.silent)showConfirm(results,zips,learned);
  return results;
}

function renderDepot(){
  buildSide('depot');
  $('#view').innerHTML=`<div class="bc"><a href="#/">ARMONIE Delivery</a><span class="sep">›</span><span class="cur">Dépôt</span></div>
    <div class="eyebrow">Auto-classement</div><h2 class="poppins" style="font-size:20px;color:var(--navy);font-weight:700">Dépose un fichier, l'app le classe</h2>
    <div class="sub" style="color:var(--muted)">Tout type de fichier est lu (texte, Excel, PDF, Word, PowerPoint…), les .zip sont décompressés. Chaque fichier est classé, intégré à la base et conservé sur ce poste. Un fichier qui correspond à une référence SharePoint la remplace automatiquement (dépose un dossier SharePoint en .zip pour tout rapatrier d'un coup).</div>
    <div class="dz" id="dz"><h3>Glisse tes fichiers (ou un .zip) ici</h3><div>tout type · les archives sont décompressées</div>
      <button class="btn" id="dzpick" type="button">Choisir des fichiers</button>
      <button class="btn" id="dzdir" type="button" style="margin-left:8px;background:var(--lav,#F5F2FC);color:var(--indigo,#3B2E8C);border:1px solid var(--filet,#E2DEF0)">Rapatrier un dossier</button>
      <input type="file" id="dzinput" multiple style="display:none"></div>
    <div class="dzact"><button class="more" id="dzcsv" style="margin:0">Exporter mes ajouts (CSV)</button><button class="reset" id="dzreset">réinitialiser mes ajouts</button><span id="dzstore" class="dzbadge"></span><span class="count" id="dzcount"></span></div>
    <div id="dztbl"></div>
    <div class="dznote"><strong>Comment ça marche.</strong> L'app lit le contenu (et décompresse les .zip), déduit client + catégorie, intègre chaque fichier à la base et le stocke sur ce poste. À la fin, un récapitulatif indique ce qui a été fait, appris et rangé. Extraction PDF : au mieux (les PDF scannés ou à polices spéciales sont classés par le nom). Rien n'est envoyé au SharePoint.</div>`;
  const sb=$('#dzstore');if(sb){sb.textContent=IDB.ok?'fichiers persistants':'métadonnées seules';sb.className='dzbadge '+(IDB.ok?'ok':'tri');}
  const dz=$('#dz'),inp=$('#dzinput');
  $('#dzpick').onclick=()=>inp.click();
  {const db=$('#dzdir');if(db)db.onclick=pickDirectory;}
  inp.onchange=()=>add([...inp.files]);
  ['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('drag');}));
  dz.addEventListener('drop',ev=>add([...ev.dataTransfer.files]));
  dz.onclick=e=>{if(e.target.id==='dz'||e.target.tagName==='H3'||e.target.tagName==='DIV')inp.click();};
  $('#dzreset').onclick=async()=>{if(window.ADDED.length&&confirm('Retirer tes '+window.ADDED.length+' ajout(s) ?')){await idbClear();window.ADDED=[];saveAdded();draw();toast('Ajouts réinitialisés');}};
  $('#dzcsv').onclick=exportCsv;
  async function add(files){ await processFiles(files); }
  function draw(){
    const L=window.ADDED;
    if(!L.length){$('#dztbl').innerHTML='<div class="empty" style="margin-top:8px">Aucun document ajouté pour l\'instant. Glisse un fichier ci-dessus.</div>';$('#dzcount').textContent='';return;}
    let h=`<table class="tbl"><thead><tr><th>Fichier</th><th>Client</th><th>Catégorie</th><th>Destination</th><th>Taille</th><th></th></tr></thead><tbody>`;
    L.forEach(d=>{h+=`<tr><td><div class="name dzopen" data-id="${d._id}" style="cursor:pointer">${I.doc}<span>${esc(d.n)}</span></div></td>
      <td>${d.client?esc(d.client):'<span class="dzbadge tri">à trier</span>'}</td>
      <td>${d.client?`<span class="tag">${esc(d.k)}</span>`:'—'}</td>
      <td><span class="path" style="font-size:12px">${esc(d.p)}</span></td>
      <td class="mono" style="font-size:12px;color:var(--muted)">${humanSize(d.size)}</td>
      <td style="white-space:nowrap;text-align:right">${(BLOBS[d._id]||d._stored)?`<a class="dzlink" data-act="open" data-id="${d._id}">ouvrir</a> · `:''}<a class="dzlink" data-act="del" data-id="${d._id}">retirer</a></td></tr>`;});
    h+='</tbody></table>';$('#dztbl').innerHTML=h;
    $('#dzcount').textContent=L.length+' document'+(L.length>1?'s':'')+' ajouté'+(L.length>1?'s':'');
    $('#dztbl').querySelectorAll('.dzopen').forEach(el=>el.onclick=()=>{const doc=(window.ADDED||[]).find(x=>x._id===el.dataset.id);if(doc)openDoc(doc);});
    $('#dztbl').querySelectorAll('.dzlink').forEach(a=>a.onclick=async()=>{
      const id=a.dataset.id;
      if(a.dataset.act==='open'){let u=BLOBS[id];if(!u){const b=await idbGet(id);if(b){u=URL.createObjectURL(b);BLOBS[id]=u;}}if(u)openInApp(u,((window.ADDED||[]).find(x=>x._id===id)||{}).n||'Document');else toast('Fichier non disponible sur ce navigateur (stockage binaire indisponible).');}
      else{await idbDel(id);window.ADDED=window.ADDED.filter(x=>x._id!==id);saveAdded();draw();}
    });
  }
  function exportCsv(){
    if(!window.ADDED.length)return;
    const rows=[['fichier','client','categorie','destination_relative','taille_octets','date']]
      .concat(window.ADDED.map(d=>[d.n,d.client||'',d.k,d.p,d.size||'',new Date(d.date).toISOString()]));
    const csv='\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='mes-ajouts_auto-classement.csv';a.click();
  }
  draw();
}

/* ---------- router ---------- */
function refreshCounts(){
  try{
    const ci={},sp={};
    allDocs().forEach(d=>{if(d.ci>=0)ci[d.ci]=(ci[d.ci]||0)+1;if(d.sp)sp[d.sp]=(sp[d.sp]||0)+1;});
    if(Array.isArray(window.CLIENTS))window.CLIENTS.forEach((c,i)=>{c.files=ci[i]||0;});
    if(Array.isArray(window.SPACES))window.SPACES.forEach(s=>{s.count=sp[s.key]||0;});
  }catch(_){}
}
function route(override){
  refreshCounts();
  const h=(override||location.hash).replace(/^#\/?/,'');
  const parts=h.split('/');
  window.scrollTo(0,0);
  if(!h){renderHome();}
  else if(parts[0]==='clients'){renderClients();}
  else if(parts[0]==='client'){renderClient(parseInt(parts[1],10));}
  else if(parts[0]==='espace'){renderSpace(parts[1]);}
  else if(parts[0]==='depot'){renderDepot();}
  else if(parts[0]==='journal'){renderJournal();}
  else if(parts[0]==='q'){renderSearch(decodeURIComponent(parts.slice(1).join('/')));}
  else{renderHome();}
}
window.addEventListener('hashchange',()=>route());
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#/"]');if(a){e.preventDefault();const hh=a.getAttribute('href');try{location.hash=hh;}catch(_){}route(hh);}});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){go('q/'+encodeURIComponent(e.target.value.trim()));}});
idbOpen().then(()=>{initTopbar();route();try{syncInit();}catch(e){}});
/* Temps réel : suit l'overlay cp|WIRE et met à jour le catalogue sans recharger.
   N'interrompt jamais une saisie / modale / fenêtre ouverte. Aucune dépendance SharePoint. */
(function liveSync(){
  const baseDocs=(window.DOCS||[]).filter(d=>d.src!=='cpwire');
  const ovSig=arr=>JSON.stringify((arr||[]).map(d=>[d.id,d.n,d.k,d.p,d.url]));
  let _sig=ovSig((window.DOCS||[]).filter(d=>d.src==='cpwire'));
  async function poll(){
    try{
      const r=await fetch('/api/sharefly/derived',{cache:'no-store'});
      if(!r.ok)return;
      const ov=await r.json();
      if(!Array.isArray(ov))return;
      const sig=ovSig(ov);
      if(sig===_sig)return;
      _sig=sig;
      window.DOCS=baseDocs.concat(ov);
      const busy=document.querySelector('#modal.show,#sheet.show')
        ||(document.getElementById('vwrap')&&document.getElementById('vwrap').classList.contains('on'))
        ||(document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName));
      if(!busy){try{route();}catch(_){}try{toast('Catalogue cp|WIRE mis à jour');}catch(_){}}
    }catch(_){}
  }
  setInterval(poll,30000);
})();
</script>
